name: Notify Discord 14h20

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'

jobs:
  send-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        run: |
          curl -X POST ${{ secrets.WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "content": "🔔 14h20 rồi! Test thành công 🚀"
          }'